<!DOCTYPE html>
<html lang="en" data-theme="dark" data-bs-theme="dark" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/logo.png">
  <title>COURTLY Admin - Courts Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Sora:wght@100..800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/admin-animations.css">
  <link rel="stylesheet" href="css/admin-style.css">
  <link rel="stylesheet" href="css/admin-responsive.css">
</head>
<body data-admin-page="courts" data-page-title="Courts">
  <div class="admin-shell">
    <div id="adminSidebarMount"></div>
    <div class="admin-main-wrap">
      <div id="adminTopbarMount"></div>

      <main class="admin-content">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4 admin-animate-in">
          <div>
            <span class="admin-demo-pill mb-1">RATES SYNCED WITH PUBLIC COURT PAGE</span>
            <h1 class="h3 fw-bold mb-1">COURTS MANAGEMENT</h1>
            <p class="small text-muted mb-0">Manage court availability, maintenance mode, hourly INR pricing, and schedules.</p>
          </div>
          <button type="button" class="btn-admin-lime" data-bs-toggle="modal" data-bs-target="#addCourtModal">+ Add New Court</button>
        </div>

        <section class="row g-4" id="adminCourtsGrid"></section>
      </main>
    </div>
  </div>

  <!-- Edit Court Modal -->
  <div class="modal fade" id="editCourtModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content admin-modal" id="editCourtForm">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Edit Court Details (Demo)</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body row g-3">
          <input type="hidden" id="editCourtId">
          <div class="col-12">
            <label class="form-label small">Court Name</label>
            <input type="text" class="form-control admin-control" id="editCourtName" required>
          </div>
          <div class="col-6">
            <label class="form-label small">Sport Category</label>
            <select class="form-select admin-control" id="editCourtSport">
              <option value="Badminton">Badminton</option>
              <option value="Table Tennis">Table Tennis</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label small">Hourly Rate (₹)</label>
            <input type="number" min="100" step="50" class="form-control admin-control" id="editCourtPrice" required>
          </div>
          <div class="col-6">
            <label class="form-label small">Availability Status</label>
            <select class="form-select admin-control" id="editCourtStatus">
              <option value="Available">Available</option>
              <option value="Occupied">Occupied</option>
              <option value="Maintenance">Maintenance</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label small">Occupancy (%)</label>
            <input type="number" min="0" max="100" class="form-control admin-control" id="editCourtOcc" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-admin-outline btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn-admin-primary btn-sm">Save Court</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Manage Schedule Modal -->
  <div class="modal fade" id="scheduleCourtModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content admin-modal">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="scheduleModalTitle">Court Schedule (Demo)</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="scheduleModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn-admin-primary btn-sm" data-bs-dismiss="modal">Done</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Add New Court Modal -->
  <div class="modal fade" id="addCourtModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content admin-modal" id="addCourtForm">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Add Sample Court (Demo)</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body row g-3">
          <div class="col-12">
            <label class="form-label small">Court Name</label>
            <input type="text" class="form-control admin-control" id="newCourtName" required placeholder="e.g. Badminton Court 03">
          </div>
          <div class="col-6">
            <label class="form-label small">Sport Category</label>
            <select class="form-select admin-control" id="newCourtSport">
              <option value="Badminton">Badminton</option>
              <option value="Table Tennis">Table Tennis</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label small">Hourly Rate (₹)</label>
            <input type="number" min="100" step="50" value="650" class="form-control admin-control" id="newCourtPrice" required>
          </div>
          <div class="col-12">
            <label class="form-label small">Description</label>
            <textarea class="form-control admin-control" id="newCourtDesc" rows="2" placeholder="Indoor court surface and lighting highlights..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-admin-outline btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn-admin-lime btn-sm">Add Court</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/site-data.js"></script>
  <script src="../js/contact-data.js"></script>
  <script src="js/admin-sidebar.js"></script>
  <script src="js/admin-courts.js"></script>
</body>
</html>
