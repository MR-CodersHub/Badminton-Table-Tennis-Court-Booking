<!DOCTYPE html>
<html lang="en" data-theme="dark" data-bs-theme="dark" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/logo.png">
  <title>COURTLY Admin - Players Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Sora:wght@100..800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/admin-animations.css">
  <link rel="stylesheet" href="css/admin-style.css">
  <link rel="stylesheet" href="css/admin-responsive.css">
</head>
<body data-admin-page="players" data-page-title="Players">
  <div class="admin-shell">
    <div id="adminSidebarMount"></div>
    <div class="admin-main-wrap">
      <div id="adminTopbarMount"></div>

      <main class="admin-content">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4 admin-animate-in">
          <div>
            <span class="admin-demo-pill mb-1">FICTIONAL DEMO PLAYER DIRECTORY</span>
            <h1 class="h3 fw-bold mb-1">PLAYERS MANAGEMENT</h1>
            <p class="small text-muted mb-0">View registered player profiles, preferred sports, membership tiers, and status.</p>
          </div>
          <button type="button" class="btn-admin-outline" id="exportPlayersCsvBtn">Export CSV</button>
        </div>

        <section class="row g-3 mb-4" id="playerSummaryCards"></section>

        <section class="admin-card mb-4">
          <div class="row g-2 align-items-end">
            <div class="col-12 col-md-4">
              <label class="form-label small text-muted mb-1">Search Player / ID / Email</label>
              <input type="search" class="form-control form-control-sm admin-control" id="plSearch" placeholder="e.g. PL-401 or Aarav">
            </div>
            <div class="col-6 col-md-4">
              <label class="form-label small text-muted mb-1">Preferred Sport</label>
              <select class="form-select form-select-sm admin-control" id="plSport">
                <option value="all">All Sports</option>
                <option value="Badminton">Badminton</option>
                <option value="Table Tennis">Table Tennis</option>
              </select>
            </div>
            <div class="col-6 col-md-4">
              <label class="form-label small text-muted mb-1">Status</label>
              <select class="form-select form-select-sm admin-control" id="plStatus">
                <option value="all">All Status</option>
                <option value="Active">Active</option>
                <option value="Suspended">Suspended</option>
              </select>
            </div>
          </div>
        </section>

        <section class="admin-card">
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Player ID</th>
                  <th>Player</th>
                  <th>Phone</th>
                  <th>Preferred Sport</th>
                  <th>Membership</th>
                  <th>Joined</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="playersTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- Player Details Modal -->
  <div class="modal fade" id="viewPlayerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content admin-modal">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Player Profile (Demo)</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="viewPlayerBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn-admin-outline btn-sm" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Player Modal -->
  <div class="modal fade" id="editPlayerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content admin-modal" id="editPlayerForm">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Edit Player Details (Demo)</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body row g-3">
          <input type="hidden" id="editPlId">
          <div class="col-12">
            <label class="form-label small">Full Name</label>
            <input type="text" class="form-control admin-control" id="editPlName" required>
          </div>
          <div class="col-6">
            <label class="form-label small">Preferred Sport</label>
            <select class="form-select admin-control" id="editPlSport">
              <option value="Badminton">Badminton</option>
              <option value="Table Tennis">Table Tennis</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label small">Membership Plan</label>
            <select class="form-select admin-control" id="editPlPlan">
              <option value="Starter">Starter</option>
              <option value="Pro Athlete">Pro Athlete</option>
              <option value="Elite Player">Elite Player</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label small">Account Status</label>
            <select class="form-select admin-control" id="editPlStatus">
              <option value="Active">Active</option>
              <option value="Suspended">Suspended</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-admin-outline btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn-admin-primary btn-sm">Save Player</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/site-data.js"></script>
  <script src="../js/contact-data.js"></script>
  <script src="js/admin-sidebar.js"></script>
  <script src="js/admin-players.js"></script>
</body>
</html>
