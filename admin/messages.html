<!DOCTYPE html>
<html lang="en" data-theme="dark" data-bs-theme="dark" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/logo.png">
  <title>COURTLY Admin - Messages &amp; Enquiries</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Sora:wght@100..800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/admin-animations.css">
  <link rel="stylesheet" href="css/admin-style.css">
  <link rel="stylesheet" href="css/admin-responsive.css">
</head>
<body data-admin-page="messages" data-page-title="Messages / Enquiries">
  <div class="admin-shell">
    <div id="adminSidebarMount"></div>
    <div class="admin-main-wrap">
      <div id="adminTopbarMount"></div>

      <main class="admin-content">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4 admin-animate-in">
          <div>
            <span class="admin-demo-pill mb-1">FRONTEND DEMO INBOX — NO LIVE EMAIL DELIVERY</span>
            <h1 class="h3 fw-bold mb-1">MESSAGES &amp; ENQUIRIES</h1>
            <p class="small text-muted mb-0">Review, filter, reply (demo), mark read/unread, or archive visitor enquiries.</p>
          </div>
        </div>

        <section class="row g-3 mb-4" id="msgSummaryCards"></section>

        <section class="admin-card mb-4">
          <div class="row g-2 align-items-end">
            <div class="col-12 col-md-5">
              <label class="form-label small text-muted mb-1">Search Sender / Subject</label>
              <input type="search" class="form-control form-control-sm admin-control" id="msgSearch" placeholder="Search enquiries...">
            </div>
            <div class="col-6 col-md-4">
              <label class="form-label small text-muted mb-1">Enquiry Category</label>
              <select class="form-select form-select-sm admin-control" id="msgCategory">
                <option value="all">All Categories</option>
                <option value="Court Booking Enquiry">Court Booking Enquiry</option>
                <option value="Membership Enquiry">Membership Enquiry</option>
                <option value="Tournament Information">Tournament Information</option>
                <option value="Facility Information">Facility Information</option>
                <option value="General Enquiry">General Enquiry</option>
              </select>
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label small text-muted mb-1">Status</label>
              <select class="form-select form-select-sm admin-control" id="msgStatus">
                <option value="all">All Status</option>
                <option value="Unread">Unread</option>
                <option value="Pending">Pending</option>
                <option value="Replied">Replied</option>
                <option value="Archived">Archived</option>
              </select>
            </div>
          </div>
        </section>

        <section class="admin-card">
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Sender</th>
                  <th>Category</th>
                  <th>Subject</th>
                  <th>Date</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="messagesTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- Message View & Demo Reply Modal -->
  <div class="modal fade" id="viewMessageModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <form class="modal-content admin-modal" id="replyMessageForm">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="msgModalSubject">Enquiry Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="msgModalId">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <div>
              <strong id="msgModalSender"></strong>
              <span class="small text-muted ms-2" id="msgModalMeta"></span>
            </div>
            <span class="admin-demo-pill" id="msgModalCat"></span>
          </div>
          <div class="p-3 rounded-3 border border-secondary border-opacity-25 mb-3" style="background:var(--bg-elevated);" id="msgModalBody"></div>
          <div>
            <label class="form-label small fw-semibold">Demo Reply (Saved Locally Only)</label>
            <textarea class="form-control admin-control" id="msgReplyText" rows="3" placeholder="Write a sample response..." required></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-admin-outline btn-sm" data-bs-dismiss="modal">Close</button>
          <button type="submit" class="btn-admin-primary btn-sm">Send Demo Reply</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/site-data.js"></script>
  <script src="../js/contact-data.js"></script>
  <script src="js/admin-sidebar.js"></script>
  <script src="js/admin-messages.js"></script>
</body>
</html>
