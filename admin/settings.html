<!DOCTYPE html>
<html lang="en" data-theme="dark" data-bs-theme="dark" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/logo.png">
  <title>COURTLY Admin - Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Sora:wght@100..800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/admin-animations.css">
  <link rel="stylesheet" href="css/admin-style.css">
  <link rel="stylesheet" href="css/admin-responsive.css">
</head>
<body data-admin-page="settings" data-page-title="Settings">
  <div class="admin-shell">
    <div id="adminSidebarMount"></div>
    <div class="admin-main-wrap">
      <div id="adminTopbarMount"></div>

      <main class="admin-content">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4 admin-animate-in">
          <div>
            <span class="admin-demo-pill mb-1">PREFERENCES SAVED IN LOCALSTORAGE</span>
            <h1 class="h3 fw-bold mb-1">ADMIN SETTINGS</h1>
            <p class="small text-muted mb-0">Configure admin profile, club info, booking rules, notifications, theme, and RTL/LTR.</p>
          </div>
          <button type="button" class="btn-admin-outline btn-sm" id="resetDemoStateBtn">Reset Demo Data</button>
        </div>

        <form id="adminSettingsForm" class="row g-4">
          <!-- Admin Profile & Club Info -->
          <div class="col-12 col-lg-6">
            <div class="admin-card h-100">
              <h2 class="h5 fw-bold mb-3">ADMIN PROFILE &amp; CLUB INFO</h2>
              <div class="row g-3">
                <div class="col-12">
                  <label class="form-label small">Admin Display Name</label>
                  <input type="text" class="form-control admin-control" id="setAdminName" required>
                </div>
                <div class="col-12">
                  <label class="form-label small">Admin Email</label>
                  <input type="email" class="form-control admin-control" id="setAdminEmail" required>
                </div>
                <div class="col-12 col-sm-6">
                  <label class="form-label small">Club Name</label>
                  <input type="text" class="form-control admin-control" id="setClubName" required>
                </div>
                <div class="col-12 col-sm-6">
                  <label class="form-label small">Contact Phone</label>
                  <input type="text" class="form-control admin-control" id="setClubPhone" required>
                </div>
                <div class="col-12">
                  <label class="form-label small">Public Contact Email</label>
                  <input type="email" class="form-control admin-control" id="setClubEmail" required>
                </div>
                <div class="col-12">
                  <label class="form-label small">Facility Address</label>
                  <input type="text" class="form-control admin-control" id="setClubAddress" required>
                </div>
              </div>
            </div>
          </div>

          <!-- Booking Settings & Notifications -->
          <div class="col-12 col-lg-6">
            <div class="admin-card h-100 d-flex flex-column gap-4">
              <div>
                <h2 class="h5 fw-bold mb-3">COURT BOOKING RULES (DEMO)</h2>
                <div class="row g-3">
                  <div class="col-6">
                    <label class="form-label small">Lead Time (Hours)</label>
                    <input type="number" min="0" max="24" class="form-control admin-control" id="setLeadHours">
                  </div>
                  <div class="col-6">
                    <label class="form-label small">Max Advance Days</label>
                    <input type="number" min="1" max="60" class="form-control admin-control" id="setMaxDays">
                  </div>
                  <div class="col-12">
                    <div class="form-check form-switch">
                      <input class="form-check-input" type="checkbox" id="setAllowNight">
                      <label class="form-check-label small" for="setAllowNight">Allow 24/7 Night Session Bookings</label>
                    </div>
                  </div>
                </div>
              </div>

              <div class="pt-3 border-top border-secondary border-opacity-25">
                <h2 class="h5 fw-bold mb-3">NOTIFICATION PREFERENCES</h2>
                <div class="d-flex flex-column gap-2">
                  <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="setNotifBookings">
                    <label class="form-check-label small" for="setNotifBookings">Alert on new demo court bookings</label>
                  </div>
                  <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="setNotifEnquiries">
                    <label class="form-check-label small" for="setNotifEnquiries">Alert on new visitor enquiries</label>
                  </div>
                  <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="setNotifMaint">
                    <label class="form-check-label small" for="setNotifMaint">Weekly court maintenance reminders</label>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Appearance & Security Demo -->
          <div class="col-12 col-lg-6">
            <div class="admin-card h-100">
              <h2 class="h5 fw-bold mb-3">APPEARANCE &amp; DIRECTION</h2>
              <div class="row g-3">
                <div class="col-6">
                  <label class="form-label small">Theme Preference</label>
                  <select class="form-select admin-control" id="setThemePref">
                    <option value="dark">Dark Mode (Navy)</option>
                    <option value="light">Light Mode (Soft White)</option>
                  </select>
                </div>
                <div class="col-6">
                  <label class="form-label small">Layout Direction</label>
                  <select class="form-select admin-control" id="setDirPref">
                    <option value="ltr">LTR (Left-to-Right)</option>
                    <option value="rtl">RTL (Right-to-Left)</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

          <div class="col-12 col-lg-6">
            <div class="admin-card h-100">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h5 fw-bold mb-0">SECURITY (DEMO UI)</h2>
                <span class="admin-demo-pill">No Backend Auth</span>
              </div>
              <div class="row g-3">
                <div class="col-12 col-sm-6">
                  <label class="form-label small">New Password (Demo)</label>
                  <input type="password" class="form-control admin-control" id="setDemoPass1" placeholder="••••••••">
                </div>
                <div class="col-12 col-sm-6">
                  <label class="form-label small">Confirm Password</label>
                  <input type="password" class="form-control admin-control" id="setDemoPass2" placeholder="••••••••">
                </div>
              </div>
            </div>
          </div>

          <div class="col-12 d-flex justify-content-end">
            <button type="submit" class="btn-admin-lime px-4">Save All Settings</button>
          </div>
        </form>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/site-data.js"></script>
  <script src="../js/contact-data.js"></script>
  <script src="js/admin-sidebar.js"></script>
  <script src="js/admin-settings.js"></script>
</body>
</html>
