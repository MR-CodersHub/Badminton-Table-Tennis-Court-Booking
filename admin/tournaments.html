<!DOCTYPE html>
<html lang="en" data-theme="dark" data-bs-theme="dark" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/logo.png">
  <title>COURTLY Admin - Tournament Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Sora:wght@100..800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/admin-animations.css">
  <link rel="stylesheet" href="css/admin-style.css">
  <link rel="stylesheet" href="css/admin-responsive.css">
</head>
<body data-admin-page="tournaments" data-page-title="Tournaments">
  <div class="admin-shell">
    <div id="adminSidebarMount"></div>
    <div class="admin-main-wrap">
      <div id="adminTopbarMount"></div>

      <main class="admin-content">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4 admin-animate-in">
          <div>
            <span class="admin-demo-pill mb-1">SYNCED WITH PUBLIC TOURNAMENTS</span>
            <h1 class="h3 fw-bold mb-1">TOURNAMENT MANAGEMENT</h1>
            <p class="small text-muted mb-0">Manage upcoming, ongoing, and completed badminton &amp; table tennis events.</p>
          </div>
          <button type="button" class="btn-admin-lime" data-bs-toggle="modal" data-bs-target="#addTournModal">+ Add Tournament</button>
        </div>

        <!-- Summary Cards -->
        <section class="row g-3 mb-4" id="tournSummaryCards"></section>

        <!-- Filter Tabs -->
        <div class="d-flex flex-wrap gap-2 mb-4" id="tournFilterTabs">
          <button type="button" class="btn-admin-primary btn-sm tourn-tab-btn" data-status="all">All Events</button>
          <button type="button" class="btn-admin-outline btn-sm tourn-tab-btn" data-status="Upcoming">Upcoming</button>
          <button type="button" class="btn-admin-outline btn-sm tourn-tab-btn" data-status="Ongoing">Ongoing</button>
          <button type="button" class="btn-admin-outline btn-sm tourn-tab-btn" data-status="Completed">Completed</button>
        </div>

        <!-- Tournament Cards -->
        <section class="row g-4" id="adminTournamentsGrid"></section>
      </main>
    </div>
  </div>

  <!-- Add Tournament Modal -->
  <div class="modal fade" id="addTournModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content admin-modal" id="addTournForm">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Add Demo Tournament</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body row g-3">
          <div class="col-12">
            <label class="form-label small">Tournament Name</label>
            <input type="text" class="form-control admin-control" id="newTournName" required placeholder="e.g. Winter Smash Open">
          </div>
          <div class="col-6">
            <label class="form-label small">Sport</label>
            <select class="form-select admin-control" id="newTournSport">
              <option value="Badminton">Badminton</option>
              <option value="Table Tennis">Table Tennis</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label small">Event Date</label>
            <input type="text" class="form-control admin-control" id="newTournDate" required placeholder="Jan 15, 2027">
          </div>
          <div class="col-6">
            <label class="form-label small">Entry Fee (₹)</label>
            <input type="text" class="form-control admin-control" id="newTournFee" value="₹800 / player" required>
          </div>
          <div class="col-6">
            <label class="form-label small">Capacity</label>
            <input type="number" class="form-control admin-control" id="newTournCap" value="32" min="8" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-admin-outline btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn-admin-lime btn-sm">Add Event</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Tournament Modal -->
  <div class="modal fade" id="editTournModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content admin-modal" id="editTournForm">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Edit Tournament (Demo)</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body row g-3">
          <input type="hidden" id="editTournId">
          <div class="col-12">
            <label class="form-label small">Tournament Name</label>
            <input type="text" class="form-control admin-control" id="editTournName" required>
          </div>
          <div class="col-6">
            <label class="form-label small">Date</label>
            <input type="text" class="form-control admin-control" id="editTournDate" required>
          </div>
          <div class="col-6">
            <label class="form-label small">Status</label>
            <select class="form-select admin-control" id="editTournStatus">
              <option value="Upcoming">Upcoming</option>
              <option value="Ongoing">Ongoing</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label small">Registered Players</label>
            <input type="number" min="0" class="form-control admin-control" id="editTournReg" required>
          </div>
          <div class="col-6">
            <label class="form-label small">Registration Label</label>
            <input type="text" class="form-control admin-control" id="editTournRegLabel" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-admin-outline btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn-admin-primary btn-sm">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Participants Modal -->
  <div class="modal fade" id="participantsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content admin-modal">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="partModalTitle">Registered Participants (Demo)</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="partModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn-admin-outline btn-sm" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/site-data.js"></script>
  <script src="../js/contact-data.js"></script>
  <script src="js/admin-sidebar.js"></script>
  <script src="js/admin-tournaments.js"></script>
</body>
</html>
