<!DOCTYPE html>
<html lang="en" data-theme="dark" data-bs-theme="dark" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/logo.png">
  <title>COURTLY Player - Tournaments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Sora:wght@100..800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/user-animations.css">
  <link rel="stylesheet" href="css/user-style.css">
  <link rel="stylesheet" href="css/user-responsive.css">
</head>
<body data-user-page="tournaments" data-page-title="Tournaments">
  <div class="user-shell">
    <div id="userSidebarMount"></div>
    <div class="user-main-wrap">
      <div id="userTopbarMount"></div>

      <main class="user-content">
        <div class="mb-4 user-animate-in">
          <span class="user-demo-pill mb-1">SYNCED WITH PUBLIC TOURNAMENTS</span>
          <h1 class="h3 fw-bold mb-1">COMPETE. CONNECT. ACHIEVE.</h1>
          <p class="small text-muted mb-0">Explore open championships, track your demo registrations, and view past events.</p>
        </div>

        <section class="row g-3 mb-4" id="userTournSummary"></section>

        <div class="d-flex flex-wrap gap-2 mb-4">
          <button type="button" class="btn-user-primary btn-sm ut-tab-btn" data-tab="open">Open for Registration</button>
          <button type="button" class="btn-user-outline btn-sm ut-tab-btn" data-tab="mine">My Upcoming Tournaments</button>
          <button type="button" class="btn-user-outline btn-sm ut-tab-btn" data-tab="past">Past Tournaments</button>
        </div>

        <section class="row g-4" id="userTournamentsGrid"></section>
      </main>
    </div>
  </div>

  <!-- Tournament Detail & Demo Registration Modal -->
  <div class="modal fade" id="userTournModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content user-modal" id="userTournRegForm">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="utModalTitle">Tournament Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="utModalId">
          <div class="user-demo-pill mb-3">Demo Registration — No Real Entry Processed</div>
          <p class="small text-muted mb-3" id="utModalDesc"></p>
          <div class="row g-2 small mb-3" id="utModalMeta"></div>
          <div id="utRegFields">
            <label class="form-label small">Division / Format</label>
            <select class="form-select user-control" id="utFormat">
              <option>Singles</option>
              <option>Doubles</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-user-outline btn-sm" data-bs-dismiss="modal">Close</button>
          <button type="submit" class="btn-user-lime btn-sm" id="utSubmitRegBtn">Register Now (Demo)</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/site-data.js"></script>
  <script src="../js/contact-data.js"></script>
  <script src="js/user-sidebar.js"></script>
  <script src="js/user-tournaments.js"></script>
</body>
</html>
