<!DOCTYPE html>
<html lang="en" data-theme="dark" data-bs-theme="dark" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/logo.png">
  <title>COURTLY Player - Find a Court</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Sora:wght@100..800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/user-animations.css">
  <link rel="stylesheet" href="css/user-style.css">
  <link rel="stylesheet" href="css/user-responsive.css">
</head>
<body data-user-page="courts" data-page-title="Find a Court">
  <div class="user-shell">
    <div id="userSidebarMount"></div>
    <div class="user-main-wrap">
      <div id="userTopbarMount"></div>

      <main class="user-content">
        <div class="mb-4 user-animate-in">
          <span class="user-demo-pill mb-1">RATES SYNCED WITH PUBLIC COURT PAGE</span>
          <h1 class="h3 fw-bold mb-1">FIND YOUR PERFECT COURT</h1>
          <p class="small text-muted mb-0">Filter by sport, preferred date, time slot, and hourly rate in ₹.</p>
        </div>

        <!-- Filters -->
        <section class="user-card mb-4">
          <div class="row g-2 align-items-end">
            <div class="col-6 col-md-3">
              <label class="form-label small text-muted mb-1">Sport</label>
              <select class="form-select form-select-sm user-control" id="fcSport">
                <option value="all">All Sports</option>
                <option value="Badminton">Badminton</option>
                <option value="Table Tennis">Table Tennis</option>
              </select>
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label small text-muted mb-1">Preferred Date</label>
              <input type="date" class="form-control form-control-sm user-control" id="fcDate">
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label small text-muted mb-1">Time Slot</label>
              <select class="form-select form-select-sm user-control" id="fcSlot">
                <option value="06:00 AM – 07:00 AM">06:00 AM – 07:00 AM</option>
                <option value="08:00 AM – 09:00 AM">08:00 AM – 09:00 AM</option>
                <option value="06:00 PM – 07:00 PM" selected>06:00 PM – 07:00 PM</option>
                <option value="07:00 PM – 08:00 PM">07:00 PM – 08:00 PM</option>
                <option value="08:00 PM – 09:00 PM">08:00 PM – 09:00 PM</option>
              </select>
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label small text-muted mb-1">Sort by Price</label>
              <select class="form-select form-select-sm user-control" id="fcSort">
                <option value="default">Recommended</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
              </select>
            </div>
          </div>
        </section>

        <!-- Courts Grid -->
        <section class="row g-4" id="findCourtsGrid"></section>
      </main>
    </div>
  </div>

  <!-- Demo Booking Modal -->
  <div class="modal fade" id="demoCourtBookModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content user-modal" id="demoCourtBookForm">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Book Court (Demo Reservation)</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="bookCourtId">
          <div class="user-demo-pill mb-3">Frontend Demo Only — No Real Payment or Live Reservation</div>
          <div class="mb-3">
            <h6 class="fw-bold mb-1" id="bookCourtName"></h6>
            <small class="text-teal fw-semibold" id="bookCourtMeta"></small>
          </div>
          <div class="row g-3 mb-3">
            <div class="col-6">
              <label class="form-label small">Date</label>
              <input type="date" class="form-control user-control" id="bookModalDate" required>
            </div>
            <div class="col-6">
              <label class="form-label small">Time Slot</label>
              <select class="form-select user-control" id="bookModalSlot">
                <option>06:00 AM – 07:00 AM</option>
                <option>08:00 AM – 09:00 AM</option>
                <option>06:00 PM – 07:00 PM</option>
                <option>07:00 PM – 08:00 PM</option>
                <option>08:00 PM – 09:00 PM</option>
              </select>
            </div>
          </div>
          <div class="p-3 rounded-3 border border-secondary border-opacity-25" style="background:var(--bg-elevated);">
            <div class="d-flex justify-content-between small mb-1">
              <span class="text-muted">Hourly Rate</span>
              <strong id="bookModalRate"></strong>
            </div>
            <div class="d-flex justify-content-between small">
              <span class="text-muted">Sample Booking Amount (1 hr)</span>
              <strong class="fs-5 text-lime" id="bookModalTotal"></strong>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-user-outline btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn-user-lime btn-sm">Confirm Demo Booking</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/site-data.js"></script>
  <script src="../js/contact-data.js"></script>
  <script src="js/user-sidebar.js"></script>
  <script src="js/user-courts.js"></script>
</body>
</html>
