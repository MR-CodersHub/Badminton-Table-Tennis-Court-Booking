<!DOCTYPE html>
<html lang="en" data-theme="dark" data-bs-theme="dark" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../assets/logo.png">
  <title>COURTLY Player - My Bookings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Sora:wght@100..800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/user-animations.css">
  <link rel="stylesheet" href="css/user-style.css">
  <link rel="stylesheet" href="css/user-responsive.css">
</head>
<body data-user-page="bookings" data-page-title="My Bookings">
  <div class="user-shell">
    <div id="userSidebarMount"></div>
    <div class="user-main-wrap">
      <div id="userTopbarMount"></div>

      <main class="user-content">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4 user-animate-in">
          <div>
            <span class="user-demo-pill mb-1">SAMPLE PLAYER BOOKINGS</span>
            <h1 class="h3 fw-bold mb-1">MY BOOKINGS</h1>
            <p class="small text-muted mb-0">View, reschedule (demo), or cancel your sample court reservations.</p>
          </div>
          <a href="find-courts.html" class="btn-user-lime">+ Book a Court</a>
        </div>

        <section class="row g-3 mb-4" id="myBookingSummary"></section>

        <!-- Filters -->
        <section class="user-card mb-4">
          <div class="row g-2 align-items-end">
            <div class="col-12 col-md-4">
              <label class="form-label small text-muted mb-1">Search ID or Court</label>
              <input type="search" class="form-control form-control-sm user-control" id="mbSearch" placeholder="e.g. CR-2026-0248 or Badminton">
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label small text-muted mb-1">Status</label>
              <select class="form-select form-select-sm user-control" id="mbStatus">
                <option value="all">All Bookings</option>
                <option value="Upcoming">Upcoming</option>
                <option value="Completed">Completed</option>
                <option value="Cancelled">Cancelled</option>
              </select>
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label small text-muted mb-1">Sport</label>
              <select class="form-select form-select-sm user-control" id="mbSport">
                <option value="all">All Sports</option>
                <option value="Badminton">Badminton</option>
                <option value="Table Tennis">Table Tennis</option>
              </select>
            </div>
            <div class="col-12 col-md-2 d-grid">
              <button type="button" class="btn-user-outline btn-sm" id="mbResetBtn">Reset</button>
            </div>
          </div>
        </section>

        <!-- Desktop Table -->
        <section class="user-card d-none d-md-block">
          <div class="user-table-wrap">
            <table class="user-table">
              <thead>
                <tr>
                  <th>Booking ID</th>
                  <th>Court</th>
                  <th>Sport</th>
                  <th>Booking Date</th>
                  <th>Time Slot</th>
                  <th>Amount</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="myBookingsTableBody"></tbody>
            </table>
          </div>
        </section>

        <!-- Mobile Stacked Cards -->
        <section class="d-md-none d-flex flex-column gap-3" id="myBookingsMobileCards"></section>
      </main>
    </div>
  </div>

  <!-- Booking Details Modal -->
  <div class="modal fade" id="myBookingDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content user-modal">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Booking Details (Demo)</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="myBookingDetailBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn-user-outline btn-sm" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Reschedule Demo Modal -->
  <div class="modal fade" id="rescheduleModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content user-modal" id="rescheduleForm">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Reschedule Session (Demo)</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body row g-3">
          <input type="hidden" id="reschedId">
          <div class="col-12">
            <label class="form-label small">New Date</label>
            <input type="date" class="form-control user-control" id="reschedDate" required>
          </div>
          <div class="col-12">
            <label class="form-label small">New Time Slot</label>
            <select class="form-select user-control" id="reschedSlot">
              <option>06:00 AM – 07:00 AM</option>
              <option>08:00 AM – 09:00 AM</option>
              <option>06:00 PM – 07:00 PM</option>
              <option>07:00 PM – 08:00 PM</option>
              <option>08:00 PM – 09:00 PM</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-user-outline btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn-user-primary btn-sm">Confirm Demo Reschedule</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/site-data.js"></script>
  <script src="../js/contact-data.js"></script>
  <script src="js/user-sidebar.js"></script>
  <script src="js/user-bookings.js"></script>
</body>
</html>
